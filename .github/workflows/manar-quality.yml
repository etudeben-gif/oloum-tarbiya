name: Manar education site quality
on:
  push:
    paths:
      - 'manar-islam/**'
      - 'tarbiya-islamia/**'
      - 'scripts/check-manar.cjs'
      - '.github/workflows/manar-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-manar.cjs
