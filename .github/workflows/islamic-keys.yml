name: Import independently labeled proposed answer keys
on:
  push:
    paths:
      - 'tarbiya-islamia/scripts/get_proposed_keys.py'
      - '.github/workflows/islamic-keys.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python tarbiya-islamia/scripts/get_proposed_keys.py
      - run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add tarbiya-islamia/proposed-keys.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Add labeled proposed corrections for authentic Islamic QCM"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
