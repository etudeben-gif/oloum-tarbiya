name: Retrieve original exam scans
on:
  push:
    paths:
      - 'scripts/render_exam_images.py'
      - '.github/workflows/exam-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering dependencies
        run: pip install --disable-pip-version-check pymupdf pillow requests
      - name: Retrieve publicly available source exams
        run: python scripts/render_exam_images.py
      - name: Commit exam page images if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/*.webp || true
          if ! git diff --cached --quiet; then
            git commit -m "Add original exam page previews"
            git push
          fi
